# =============================================================
# Configuração da API do NutriMente
#
# ${VARIAVEL:padrao} = lê a variável de ambiente (vinda do .env pelo
# docker-compose) e usa o valor depois dos ":" se ela não existir.
# Os padrões servem para rodar localmente; NUNCA use-os em produção.
# =============================================================

spring.application.name=nutrimente-api
server.port=${API_PORT:8080}

# IP real de quem acessa. A API só aceita o cabeçalho X-Forwarded-For quando
# a requisição vem de um servidor da REDE INTERNA (o Next.js, um nginx...).
# Vindo direto da internet, o cabeçalho é ignorado: ninguém forja o próprio IP.
# request.getRemoteAddr() passa a devolver o IP correto.
server.forward-headers-strategy=native

# ---------- Banco de dados (SQL Server) ----------
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=NutriMente;encrypt=true;trustServerCertificate=true
spring.datasource.username=${NUTRIMENTE_DB_USER:nutrimente_app}
spring.datasource.password=${NUTRIMENTE_DB_PASSWORD:}

# As tabelas são criadas pelos scripts em database/sqlserver/scripts.
# "none" = o Hibernate NUNCA altera o banco (o usuário da aplicação nem teria
# permissão para isso).
spring.jpa.hibernate.ddl-auto=none
# Fecha a conexão com o banco ao terminar o service, não ao terminar a
# resposta HTTP (evita consultas "escondidas" nos controllers)
spring.jpa.open-in-view=false
# Todas as datas são gravadas em UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- E-mail (Mailpit em desenvolvimento) ----------
# O Mailpit é um "carteiro falso": recebe todos os e-mails e mostra numa
# página (http://localhost:8025). Nenhum e-mail sai de verdade.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
# Em produção (SMTP de verdade, ex.: o e-mail da Hostinger) também é preciso
# usuário, senha e conexão criptografada. Em desenvolvimento ficam vazios/false.
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
# Porta 465 usa SSL direto; porta 587 usa STARTTLS. Ligue só um dos dois.
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ---------- Health check ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ---------- Configurações próprias do NutriMente (AppProperties.java) ----------
# Endereço do front, usado nos links dos e-mails
nutrimente.frontend-url=${FRONTEND_URL:http://localhost:3000}
# Chave que assina os tokens de login. Precisa ter 32+ caracteres e ser a
# MESMA do front (SESSION_SECRET), que confere o token no proxy.ts.
nutrimente.jwt.secret=${JWT_SECRET:}
nutrimente.jwt.expiration=${JWT_EXPIRATION:8h}
nutrimente.mail.from=${MAIL_FROM:NutriMente <nao-responda@nutrimente.local>}
# Serviço de logs em Node.js (services/logs-service)
nutrimente.logs.url=${LOGS_SERVICE_URL:http://localhost:4000}
nutrimente.logs.api-key=${LOGS_API_KEY:}
# Limite de requisições por IP nas rotas /api/auth/** (login, cadastro,
# "esqueci a senha"). Protege contra robôs testando muitas senhas/contas.
nutrimente.rate-limit.auth-requests-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:30}
# Lembrete automático na véspera da consulta (e-mail + notificação)
nutrimente.appointments.reminders-enabled=${REMINDERS_ENABLED:true}
# Chave que criptografa dados sensíveis no banco: prontuário, questionário,
# triagem e CPF/telefone/data de nascimento.
# Vazia = derivada do JWT_SECRET (só para desenvolvimento). PERDER OU TROCAR
# a chave deixa os registros já gravados ilegíveis: guarde-a com os backups.
nutrimente.records.encryption-key=${RECORDS_ENCRYPTION_KEY:}
# Administrador criado automaticamente na primeira vez que a API liga
nutrimente.admin.email=${ADMIN_EMAIL:}
nutrimente.admin.password=${ADMIN_PASSWORD:}
