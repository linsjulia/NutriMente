# Perfil "test": ativado nos testes com @ActiveProfiles("test").
# Usa o mesmo SQL Server do docker compose; os testes apagam o que criam.
# Mesmo JWT_SECRET da API do docker compose (vem do .env), com um valor de
# teste se não houver .env. Importa porque a chave que cifra CPF, prontuário
# etc. sai dele (ou de RECORDS_ENCRYPTION_KEY): os testes usam o MESMO banco
# e precisam ler os dados cifrados pela API, como os da demonstração.
nutrimente.jwt.secret=${JWT_SECRET:chave-de-teste-com-mais-de-32-caracteres-123}
nutrimente.logs.api-key=
# Sem admin automático: o teste que precisa cria o seu e apaga depois
nutrimente.admin.email=
nutrimente.admin.password=
# Os outros testes fazem muitos logins seguidos do mesmo "IP" (127.0.0.1)
nutrimente.rate-limit.auth-requests-per-minute=100000
# Lembretes rodam só quando o teste chama ReminderService.sendDue() (sem tarefa agendada)
nutrimente.appointments.reminders-enabled=false
# NÃO cifrar dados antigos ao subir: isso é papel da API do docker. Rodando
# sem .env, os testes usariam a chave de teste e cifrariam os dados de
# verdade do banco com a chave errada
nutrimente.records.encrypt-legacy-on-startup=false
# Fotos do diário nos testes: pasta temporária (fora do projeto)
nutrimente.uploads.dir=${java.io.tmpdir}/nutrimente-test-uploads
