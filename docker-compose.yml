# NutriMente - infraestrutura local
#   SQL Server  -> dados da aplicação
#   api         -> API REST em Java (Spring Boot), porta 8080
#   mailpit     -> caixa de e-mails de teste, http://localhost:8025
#   MongoDB     -> logs (aplicação, acesso e auditoria LGPD)
#   logs-service-> serviço Node.js que grava/consulta os logs no MongoDB
#
# O docker compose sobe vários containers juntos, já ligados numa rede
# interna: dentro dela um serviço acessa o outro pelo NOME (ex.: o
# logs-service conecta em "mongodb:27017", não em localhost).
#
# Comandos úteis:
#   docker compose up -d --build   liga tudo (recompila imagens se mudaram)
#   docker compose ps              mostra status (healthy = saudável)
#   docker compose logs -f sqlserver   acompanha os logs de um serviço
#   docker compose down            desliga (os DADOS são mantidos)
#   docker compose down -v         desliga e APAGA os dados (recria do zero)
#
# Os valores ${...} vêm do arquivo .env (copie de .env.example).
# ${VAR:-padrao} usa "padrao" se a variável não existir.

name: nutrimente

services:
  # Banco principal. build = usa o Dockerfile da pasta indicada
  sqlserver:
    build: ./database/sqlserver
    container_name: nutrimente-sqlserver
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      NUTRIMENTE_DB_USER: ${NUTRIMENTE_DB_USER}
      NUTRIMENTE_DB_PASSWORD: ${NUTRIMENTE_DB_PASSWORD}
    # "porta_no_seu_pc:porta_no_container" -> conecte pelo Azure Data Studio,
    # DBeaver ou SSMS em localhost,1433
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    # Volume = pasta persistente gerenciada pelo Docker. Sem ele, os dados
    # sumiriam ao recriar o container.
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  # Banco de logs. Usa a imagem oficial pronta (não precisa de Dockerfile)
  mongodb:
    image: mongo:8.0
    container_name: nutrimente-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_LOGS_DB: ${MONGO_LOGS_DB:-nutrimente_logs}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
      # Monta nossa pasta de scripts dentro do container (ro = somente leitura).
      # O Mongo executa esses scripts na primeira inicialização.
      - ./database/mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Serviço Node.js que recebe logs via HTTP e grava no MongoDB
  logs-service:
    build: ./services/logs-service
    container_name: nutrimente-logs-service
    environment:
      PORT: 4000
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_LOGS_DB:-nutrimente_logs}
      MONGO_LOGS_DB: ${MONGO_LOGS_DB:-nutrimente_logs}
      LOGS_API_KEY: ${LOGS_API_KEY}
    ports:
      - "${LOGS_SERVICE_PORT:-4000}:4000"
    # Só liga depois que o MongoDB passar no healthcheck
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # "Carteiro falso" para desenvolvimento: recebe TODOS os e-mails da API
  # (confirmação de cadastro, redefinição de senha) e mostra numa página:
  # http://localhost:8025. Nenhum e-mail sai de verdade.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: nutrimente-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # página web
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP (por onde a API envia)
    restart: unless-stopped

  # API REST em Java (Spring Boot): cadastro, login, perfis e permissões
  api:
    build: ./backend
    container_name: nutrimente-api
    environment:
      DB_HOST: sqlserver
      NUTRIMENTE_DB_USER: ${NUTRIMENTE_DB_USER}
      NUTRIMENTE_DB_PASSWORD: ${NUTRIMENTE_DB_PASSWORD}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      LOGS_SERVICE_URL: http://logs-service:4000
      LOGS_API_KEY: ${LOGS_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-30}
    ports:
      - "${API_PORT:-8080}:8080"
    # Só liga depois que o banco (com as tabelas) e o serviço de logs estiverem prontos
    depends_on:
      sqlserver:
        condition: service_healthy
      logs-service:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

# Declaração dos volumes persistentes usados acima
volumes:
  sqlserver-data:
  mongodb-data:
